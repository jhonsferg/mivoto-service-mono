# ==========================================
# COMPONENTS
# ==========================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido del endpoint /api/auth/login

  parameters:
    ElectionId:
      name: id
      in: path
      required: true
      description: ID de la elección
      schema:
        type: integer
        format: int64
      example: 1

  schemas:
    # ==========================================
    # REQUEST SCHEMAS
    # ==========================================
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Documento de identidad o email del usuario
          example: "12345678"
        password:
          type: string
          format: password
          description: Contraseña del usuario
          example: "voter123"

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Token de refresco obtenido en el login
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    ChangePasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
          format: password
          description: Contraseña actual
        newPassword:
          type: string
          format: password
          minLength: 6
          maxLength: 50
          description: Nueva contraseña (mínimo 6 caracteres)

    VoteRequest:
      type: object
      required:
        - electionId
        - candidateId
      properties:
        electionId:
          type: integer
          format: int64
          description: ID de la elección
          example: 1
        candidateId:
          type: integer
          format: int64
          description: ID del candidato
          example: 3

    CreateElectionRequest:
      type: object
      required:
        - title
        - startDate
        - endDate
      properties:
        title:
          type: string
          maxLength: 200
          description: Título de la elección
          example: "Elección Presidencial 2024"
        description:
          type: string
          maxLength: 1000
          description: Descripción de la elección
          example: "Elección para elegir al presidente del país"
        startDate:
          type: string
          format: date-time
          description: Fecha y hora de inicio (debe ser futura)
          example: "2024-11-01T08:00:00"
        endDate:
          type: string
          format: date-time
          description: Fecha y hora de fin (debe ser posterior a startDate)
          example: "2024-11-01T18:00:00"
        maxVotesPerUser:
          type: integer
          minimum: 1
          default: 1
          description: Máximo de votos por usuario
        allowsBlankVote:
          type: boolean
          default: false
          description: Permite voto en blanco
        requiresVerification:
          type: boolean
          default: false
          description: Requiere verificación del voto

    UpdateElectionRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    CreateCandidateRequest:
      type: object
      required:
        - electionId
        - number
        - name
      properties:
        electionId:
          type: integer
          format: int64
          description: ID de la elección
          example: 1
        number:
          type: integer
          minimum: 1
          description: Número del candidato (único por elección)
          example: 1
        name:
          type: string
          maxLength: 200
          description: Nombre completo del candidato
          example: "Juan Pérez"
        party:
          type: string
          maxLength: 150
          description: Partido político
          example: "Partido Democrático"
        description:
          type: string
          maxLength: 1000
          description: Descripción o propuestas del candidato
        photoUrl:
          type: string
          maxLength: 500
          format: uri
          description: URL de la foto del candidato

    # ==========================================
    # RESPONSE SCHEMAS
    # ==========================================
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indica si la operación fue exitosa
        message:
          type: string
          description: Mensaje descriptivo de la respuesta
        timestamp:
          type: string
          format: date-time
          description: Timestamp de la respuesta
        data:
          type: object
          description: Datos de la respuesta

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: Código de estado HTTP
        error:
          type: string
          description: Tipo de error
        message:
          type: string
          description: Mensaje de error
        path:
          type: string
          description: Path del endpoint
        timestamp:
          type: string
          format: date-time
        validationErrors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  description: Token JWT de acceso
                refreshToken:
                  type: string
                  description: Token para refrescar el acceso
                tokenType:
                  type: string
                  enum: [Bearer]
                expiresAt:
                  type: string
                  format: date-time
                  description: Fecha de expiración del token
                user:
                  $ref: '#/components/schemas/UserDto'

    UserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        documentNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
        lastLogin:
          type: string
          format: date-time

    VoteResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        electionId:
          type: integer
          format: int64
        candidateId:
          type: integer
          format: int64
        voteHash:
          type: string
          description: Hash SHA-256 único del voto
        status:
          $ref: '#/components/schemas/VoteStatus'
        verified:
          type: boolean
        votedAt:
          type: string
          format: date-time
        verificationCode:
          type: string
          description: Código de verificación (si aplica)

    VoteRecordDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        voteId:
          type: integer
          format: int64
        electionId:
          type: integer
          format: int64
        voteHash:
          type: string
        timestamp:
          type: string
          format: date-time
        verified:
          type: boolean

    ElectionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ElectionStatus'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        maxVotesPerUser:
          type: integer
        allowsBlankVote:
          type: boolean
        requiresVerification:
          type: boolean
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CandidateDto'
        hasVoted:
          type: boolean
          description: Indica si el usuario actual ya votó
        createdAt:
          type: string
          format: date-time

    ElectionResultsResponse:
      type: object
      properties:
        electionId:
          type: integer
          format: int64
        electionTitle:
          type: string
        totalVotes:
          type: integer
          format: int64
        results:
          type: array
          items:
            $ref: '#/components/schemas/CandidateResult'

    CandidateResult:
      type: object
      properties:
        candidateId:
          type: integer
          format: int64
        candidateName:
          type: string
        party:
          type: string
        number:
          type: integer
        votes:
          type: integer
          format: int64
        percentage:
          type: number
          format: double

    CandidateDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        electionId:
          type: integer
          format: int64
        number:
          type: integer
        name:
          type: string
        party:
          type: string
        description:
          type: string
        photoUrl:
          type: string
        active:
          type: boolean
        voteCount:
          type: integer

    AuditLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        action:
          $ref: '#/components/schemas/AuditAction'
        entity:
          type: string
        entityId:
          type: integer
          format: int64
        description:
          type: string
        ipAddress:
          type: string
        userAgent:
          type: string
        timestamp:
          type: string
          format: date-time
        metadata:
          type: string

    AuditReport:
      type: object
      properties:
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        totalActions:
          type: integer
          format: int64
        totalUsers:
          type: integer
          format: int64
        criticalActions:
          type: integer
          format: int64
        securityIncidents:
          type: integer
          format: int64
        recentLogs:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'

    SystemStatistics:
      type: object
      properties:
        totalUsers:
          type: integer
          format: int64
        totalElections:
          type: integer
          format: int64
        activeElections:
          type: integer
          format: int64
        totalVotes:
          type: integer
          format: int64

    ElectionStatistics:
      type: object
      properties:
        totalVotes:
          type: integer
          format: int64
        totalCandidates:
          type: integer
          format: int64
        leadingCandidate:
          $ref: '#/components/schemas/CandidateDto'
        participationRate:
          type: number
          format: double
        votesByParty:
          type: object
          additionalProperties:
            type: integer
            format: int64

    CandidateStatistics:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        party:
          type: string
        votes:
          type: integer
          format: int64
        percentage:
          type: number
          format: double

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        timestamp:
          type: string
          format: date-time
        database:
          type: string
          enum: [UP, DOWN]
        dataStructures:
          $ref: '#/components/schemas/DataStructuresStatus'

    DataStructuresStatus:
      type: object
      properties:
        voteQueue:
          type: string
        voteRecordList:
          type: string
        candidateSearchTree:
          type: string
        electionGraph:
          type: string

    DetailedHealthStatus:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        voteQueueSize:
          type: integer
        voteRecordsCount:
          type: integer
        candidateTreeSize:
          type: integer
        candidateTreeHeight:
          type: integer
        candidateTreeBalanced:
          type: boolean
        electionGraphStats:
          $ref: '#/components/schemas/GraphStatistics'

    GraphStatistics:
      type: object
      properties:
        totalNodes:
          type: integer
        totalEdges:
          type: integer
        averageDegree:
          type: number
          format: double

    # ==========================================
    # ENUMS
    # ==========================================
    UserRole:
      type: string
      enum:
        - VOTER
        - ADMIN
        - SUPERVISOR
        - AUDITOR
      description: |
        Roles de usuario:
        - VOTER: Usuario votante
        - ADMIN: Administrador del sistema
        - SUPERVISOR: Supervisor electoral
        - AUDITOR: Auditor del sistema

    ElectionStatus:
      type: string
      enum:
        - DRAFT
        - SCHEDULED
        - ACTIVE
        - CLOSED
        - CANCELLED
      description: |
        Estados de elección:
        - DRAFT: Borrador
        - SCHEDULED: Programada
        - ACTIVE: Activa
        - CLOSED: Cerrada
        - CANCELLED: Cancelada

    VoteStatus:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - REJECTED
        - UNDER_REVIEW
      description: |
        Estados de voto:
        - PENDING: Pendiente de procesamiento
        - CONFIRMED: Confirmado
        - REJECTED: Rechazado
        - UNDER_REVIEW: En revisión

    AuditAction:
      type: string
      enum:
        - LOGIN
        - LOGOUT
        - VOTE_CAST
        - VOTE_VERIFIED
        - ELECTION_CREATED
        - ELECTION_UPDATED
        - ELECTION_STARTED
        - ELECTION_CLOSED
        - CANDIDATE_ADDED
        - CANDIDATE_UPDATED
        - USER_CREATED
        - USER_UPDATED
        - PASSWORD_CHANGED
        - UNAUTHORIZED_ACCESS
      description: Tipos de acciones auditadas

  # ==========================================
  # RESPONSES REUTILIZABLES
  # ==========================================
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            error: Bad Request
            message: Error de validación en los datos enviados
            path: /api/votes
            timestamp: "2025-01-17T20:00:00"
            validationErrors:
              - field: candidateId
                message: El ID del candidato es obligatorio

    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            error: Unauthorized
            message: Credenciales inválidas o token expirado
            path: /api/votes
            timestamp: "2025-01-17T20:00:00"

    Forbidden:
      description: Acceso denegado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            error: Forbidden
            message: No tiene permisos para acceder a este recurso
            path: /api/elections
            timestamp: "2025-01-17T20:00:00"

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            error: Not Found
            message: Recurso no encontrado
            path: /api/elections/999
            timestamp: "2025-01-17T20:00:00"

    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 500
            error: Internal Server Error
            message: Ha ocurrido un error interno en el servidor
            path: /api/votes
            timestamp: "2025-01-17T20:00:00"
