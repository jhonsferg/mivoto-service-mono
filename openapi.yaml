openapi: 3.0.3

info:
  title: MiVoto API
  description: |
    API REST para sistema de votación electrónica seguro y escalable.
    
    ## Versionamiento
    Esta API utiliza versionamiento por URL. La versión actual es v1.
    
    ## Rate Limiting
    - Usuarios autenticados: 100 requests/minuto
    - Endpoints públicos: 50 requests/minuto
    
    ## Códigos de Estado HTTP
    - 200: Operación exitosa
    - 201: Recurso creado exitosamente
    - 400: Solicitud inválida
    - 401: No autenticado
    - 403: Acceso denegado
    - 404: Recurso no encontrado
    - 409: Conflicto (ej: voto duplicado)
    - 500: Error interno del servidor
    
  version: 1.0.0
  contact:
    name: Equipo de Desarrollo
    email: dev@mivoto.com
    url: https://github.com/mivoto
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://mivoto.com/terms

servers:
  - url: https://api.mivoto.com
    description: Servidor de Producción
  - url: https://api-staging.mivoto.com
    description: Servidor de Staging
  - url: http://localhost:8080
    description: Servidor de Desarrollo Local

tags:
  - name: Authentication
    description: Endpoints de autenticación y gestión de sesiones
  - name: Voting
    description: Endpoints de votación y verificación de votos
  - name: Elections
    description: Gestión de elecciones
  - name: Candidates
    description: Gestión de candidatos
  - name: Users
    description: Gestión de usuarios
  - name: Audit
    description: Logs de auditoría y trazabilidad
  - name: Statistics
    description: Estadísticas y reportes
  - name: Health
    description: Estado del sistema

security:
  - bearerAuth: []

paths:
  # ==========================================
  # AUTHENTICATION ENDPOINTS
  # ==========================================
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Iniciar sesión
      description: Autentica un usuario y retorna tokens JWT (access y refresh)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              adminLogin:
                summary: Login de administrador
                value:
                  username: admin@mivoto.com
                  password: admin123
              voterLogin:
                summary: Login de votante
                value:
                  username: "12345678"
                  password: voter123
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                successfulLogin:
                  summary: Login exitoso
                  value:
                    success: true
                    message: Login exitoso
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      tokenType: Bearer
                      expiresAt: "2025-01-18T04:00:00"
                      user:
                        id: 1
                        documentNumber: "12345678"
                        firstName: Admin
                        lastName: Sistema
                        email: admin@mivoto.com
                        role: ADMIN
                        active: true
                        lastLogin: "2025-01-17T20:00:00"
                    timestamp: "2025-01-17T20:00:00"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Cerrar sesión
      description: Invalida la sesión actual del usuario
      operationId: logout
      responses:
        '200':
          description: Sesión cerrada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Sesión cerrada exitosamente
                data: null
                timestamp: "2025-01-17T20:00:00"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refrescar token
      description: Genera un nuevo access token usando el refresh token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refrescado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/change-password:
    post:
      tags:
        - Authentication
      summary: Cambiar contraseña
      description: Cambia la contraseña del usuario autenticado
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Contraseña cambiada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # VOTING ENDPOINTS
  # ==========================================
  /api/votes:
    post:
      tags:
        - Voting
      summary: Emitir voto
      description: Registra un voto del usuario autenticado en una elección
      operationId: castVote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '201':
          description: Voto registrado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: El usuario ya votó en esta elección
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/votes/verify/{voteHash}:
    get:
      tags:
        - Voting
      summary: Verificar voto
      description: Verifica la autenticidad de un voto usando su hash único
      operationId: verifyVote
      security: []
      parameters:
        - name: voteHash
          in: path
          required: true
          description: Hash SHA-256 del voto
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
          example: "a1b2c3d4e5f6..."
      responses:
        '200':
          description: Voto verificado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VoteRecordDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/votes/history:
    get:
      tags:
        - Voting
      summary: Historial de votos
      description: Obtiene el historial de votos del usuario autenticado
      operationId: getVotingHistory
      responses:
        '200':
          description: Historial obtenido exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VoteRecordDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/votes/status/{electionId}:
    get:
      tags:
        - Voting
      summary: Estado de voto
      description: Verifica si el usuario ya votó en una elección
      operationId: checkVotingStatus
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Estado obtenido exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # ELECTIONS ENDPOINTS
  # ==========================================
  /api/elections:
    get:
      tags:
        - Elections
      summary: Listar todas las elecciones
      description: Obtiene todas las elecciones del sistema
      operationId: getAllElections
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ElectionResponse'

    post:
      tags:
        - Elections
      summary: Crear elección
      description: Crea una nueva elección (solo ADMIN)
      operationId: createElection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateElectionRequest'
      responses:
        '201':
          description: Elección creada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ElectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/elections/active:
    get:
      tags:
        - Elections
      summary: Listar elecciones activas
      description: Obtiene todas las elecciones activas
      operationId: getActiveElections
      security: []
      responses:
        '200':
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ElectionResponse'

  /api/elections/{id}:
    get:
      tags:
        - Elections
      summary: Obtener elección por ID
      description: Obtiene los detalles de una elección específica
      operationId: getElectionById
      security: []
      parameters:
        - $ref: '#/components/parameters/ElectionId'
      responses:
        '200':
          description: Elección obtenida exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ElectionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Elections
      summary: Actualizar elección
      description: Actualiza una elección existente (solo ADMIN)
      operationId: updateElection
      parameters:
        - $ref: '#/components/parameters/ElectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateElectionRequest'
      responses:
        '200':
          description: Elección actualizada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ElectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/elections/{id}/start:
    post:
      tags:
        - Elections
      summary: Iniciar elección
      description: Inicia una elección programada (solo ADMIN)
      operationId: startElection
      parameters:
        - $ref: '#/components/parameters/ElectionId'
      responses:
        '200':
          description: Elección iniciada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/elections/{id}/close:
    post:
      tags:
        - Elections
      summary: Cerrar elección
      description: Cierra una elección activa (solo ADMIN)
      operationId: closeElection
      parameters:
        - $ref: '#/components/parameters/ElectionId'
      responses:
        '200':
          description: Elección cerrada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/elections/{id}/cancel:
    post:
      tags:
        - Elections
      summary: Cancelar elección
      description: Cancela una elección (solo ADMIN)
      operationId: cancelElection
      parameters:
        - $ref: '#/components/parameters/ElectionId'
        - name: reason
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Elección cancelada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/elections/{id}/results:
    get:
      tags:
        - Elections
      summary: Obtener resultados
      description: Obtiene los resultados de una elección (solo ADMIN/SUPERVISOR)
      operationId: getElectionResults
      parameters:
        - $ref: '#/components/parameters/ElectionId'
      responses:
        '200':
          description: Resultados obtenidos exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ElectionResultsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/elections/{id}/statistics:
    get:
      tags:
        - Elections
      summary: Obtener estadísticas
      description: Obtiene estadísticas de una elección (solo ADMIN/SUPERVISOR)
      operationId: getElectionStatistics
      parameters:
        - $ref: '#/components/parameters/ElectionId'
      responses:
        '200':
          description: Estadísticas obtenidas exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ElectionStatistics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/elections/status/{status}:
    get:
      tags:
        - Elections
      summary: Filtrar por estado
      description: Obtiene elecciones filtradas por estado
      operationId: getElectionsByStatus
      security: []
      parameters:
        - name: status
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ElectionStatus'
      responses:
        '200':
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ElectionResponse'

  # ==========================================
  # CANDIDATES ENDPOINTS
  # ==========================================
  /api/candidates:
    post:
      tags:
        - Candidates
      summary: Registrar candidato
      description: Registra un nuevo candidato (solo ADMIN)
      operationId: registerCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCandidateRequest'
      responses:
        '201':
          description: Candidato registrado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CandidateDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/candidates/{id}:
    get:
      tags:
        - Candidates
      summary: Obtener candidato
      description: Obtiene un candidato por su ID
      operationId: getCandidateById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Candidato obtenido exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CandidateDto'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Candidates
      summary: Actualizar candidato
      description: Actualiza un candidato (solo ADMIN)
      operationId: updateCandidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCandidateRequest'
      responses:
        '200':
          description: Candidato actualizado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CandidateDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Candidates
      summary: Eliminar candidato
      description: Elimina un candidato (solo ADMIN, solo si no tiene votos)
      operationId: deleteCandidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Candidato eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El candidato tiene votos registrados

  /api/candidates/election/{electionId}:
    get:
      tags:
        - Candidates
      summary: Listar candidatos por elección
      description: Obtiene todos los candidatos de una elección
      operationId: getCandidatesByElection
      security: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CandidateDto'

  /api/candidates/election/{electionId}/active:
    get:
      tags:
        - Candidates
      summary: Listar candidatos activos
      description: Obtiene candidatos activos de una elección
      operationId: getActiveCandidates
      security: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CandidateDto'

  /api/candidates/election/{electionId}/number/{number}:
    get:
      tags:
        - Candidates
      summary: Buscar candidato por número
      description: Busca un candidato por su número en una elección
      operationId: findCandidateByNumber
      security: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: number
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Candidato encontrado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CandidateDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/candidates/{id}/activate:
    post:
      tags:
        - Candidates
      summary: Activar candidato
      description: Activa un candidato desactivado (solo ADMIN)
      operationId: activateCandidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Candidato activado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/candidates/{id}/deactivate:
    post:
      tags:
        - Candidates
      summary: Desactivar candidato
      description: Desactiva un candidato (solo ADMIN)
      operationId: deactivateCandidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Candidato desactivado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==========================================
  # AUDIT ENDPOINTS
  # ==========================================
  /api/audit/user/{userId}:
    get:
      tags:
        - Audit
      summary: Auditoría por usuario
      description: Obtiene logs de auditoría de un usuario (solo ADMIN/SUPERVISOR)
      operationId: getAuditTrailByUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Logs obtenidos exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/audit/entity/{entity}/{entityId}:
    get:
      tags:
        - Audit
      summary: Auditoría por entidad
      description: Obtiene logs de auditoría de una entidad (solo ADMIN/SUPERVISOR)
      operationId: getAuditTrailByEntity
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
        - name: entityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Logs obtenidos exitosamente
          content:
            application/json:
              schema:
