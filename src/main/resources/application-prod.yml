spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/mivoto_prod}
    username: ${DATABASE_USER:mivoto_prod}
    password: ${DATABASE_PASSWORD:STRONG_PROD_PASSWORD_XYZ}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    show-sql: false

jwt:
  secret: ${JWT_SECRET:VERY_LONG_AND_SECURE_PRODUCTION_SECRET_KEY_FOR_JWT_SIGNING}
  expiration: 3600000 # 1 hour for prod

logging:
  level:
    root: WARN
    pe.com.mivoto.service: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
