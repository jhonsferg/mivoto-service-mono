spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/mivoto_qa}
    username: ${DATABASE_USER:mivoto_qa}
    password: ${DATABASE_PASSWORD:secure_qa_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET:qaSecretKeyThatIsStrongerThanDev123456789}

logging:
  level:
    root: INFO
    pe.com.mivoto.service: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
