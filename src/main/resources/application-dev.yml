spring:
  datasource:
    url: jdbc:h2:mem:voting_system_dev
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

logging:
  level:
    root: DEBUG
    pe.com.mivoto.service: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
