spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mivoto}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:localSecretKeyForJWTTokenGeneration123456789}
  expiration: 86400000 # 24 hours for local dev

logging:
  level:
    root: INFO
    pe.com.mivoto.service: DEBUG
    
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
