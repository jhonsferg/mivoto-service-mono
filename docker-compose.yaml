services:
  # PostgreSQL Database
  postgres:
    image: postgres:16.1-alpine
    container_name: mivoto-postgres-dev
    restart: unless-stopped
    environment:
      TZ: America/Lima
      PGTZ: America/Lima
      POSTGRES_DB: ${POSTGRES_DB:-mivoto}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=es_PE.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - mivoto-dev-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mivoto}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"

  # Redis Cache
  redis:
    image: redis:7.2.4-alpine
    container_name: mivoto-redis-dev
    restart: unless-stopped
    environment:
      TZ: America/Lima
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - mivoto-dev-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # pgAdmin - PostgreSQL Management Tool
  pgadmin:
    image: dpage/pgadmin4:8.2
    container_name: mivoto-pgadmin-dev
    restart: unless-stopped
    environment:
      TZ: America/Lima
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mivoto.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - mivoto-dev-network
    depends_on:
      postgres:
        condition: service_healthy

  # Redis Commander - Redis Management Tool
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: mivoto-redis-commander-dev
    restart: unless-stopped
    environment:
      TZ: America/Lima
      REDIS_HOSTS: local:redis:${REDIS_PORT:-6379}
    ports:
      - "${REDIS_COMMANDER_PORT:-8082}:8081"
    networks:
      - mivoto-dev-network
    depends_on:
      redis:
        condition: service_healthy

  # SonarQube - Code Quality
  sonarqube:
    image: sonarqube:community
    container_name: mivoto-sonarqube-dev
    restart: unless-stopped
    environment:
      TZ: America/Lima
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - mivoto-dev-network

networks:
  mivoto-dev-network:
    driver: bridge
    name: mivoto-dev-network

volumes:
  postgres_data:
    name: mivoto_postgres_dev_data
  redis_data:
    name: mivoto_redis_dev_data
  pgadmin_data:
    name: mivoto_pgadmin_dev_data
  sonarqube_data:
    name: mivoto_sonarqube_dev_data
  sonarqube_extensions:
    name: mivoto_sonarqube_dev_extensions
  sonarqube_logs:
    name: mivoto_sonarqube_dev_logs
